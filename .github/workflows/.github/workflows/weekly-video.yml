name: V1PGL Weekly

on:
  repository_dispatch:
    types: [weekly-video]          # the Stat Desk "Make video" button
  workflow_dispatch:               # or run it by hand from the Actions tab
    inputs:
      week:
        description: "Week to render (e.g. 2, WC, DIV)"
        required: true
      voice:
        description: "Optional: lead host voice for this run (e.g. en-US-Andrew:DragonHDLatestNeural)"
        required: false

permissions:
  contents: write                  # publishing the video as a release

concurrency:
  group: weekly-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300            # a full show with clips can take about an hour to render
    env:
      HUB_API: ${{ secrets.HUB_API }}
      VIDEO_SECRET: ${{ secrets.VIDEO_SECRET }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION || 'eastus' }}
      AZURE_VOICE: ${{ inputs.voice || vars.AZURE_VOICE }}
      AZURE_VOICE_2: ${{ vars.AZURE_VOICE_2 }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVEN_VOICE_ID: ${{ vars.ELEVEN_VOICE_ID }}
      WEEK: ${{ github.event.client_payload.week || inputs.week }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install clip downloader
        run: sudo curl -sSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && sudo chmod a+rx /usr/local/bin/yt-dlp && yt-dlp --version
      - name: Install renderer
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Voice and render
        run: node render.mjs
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -a; . out/env; set +a
          TAG="$(echo "$SEASON-$LABEL" | tr ' ' '-' | tr '[:upper:]' '[:lower:]')-$GITHUB_RUN_ID"
          gh release create "$TAG" "$VIDEO_FILE" out/thumb.jpg --title "V1PGL Weekly · $SEASON $LABEL" --notes "Weekly recap show · ${VIDEO_SECONDS}s"
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$VIDEO_NAME"
          echo "Video: $URL" >> "$GITHUB_STEP_SUMMARY"
          node report.mjs done "$URL"
      - name: Report failure
        if: failure()
        run: node report.mjs error "$(cat out/error.txt 2>/dev/null || echo 'Render failed') · $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
