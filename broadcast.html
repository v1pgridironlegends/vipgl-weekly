<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>V1PGL Weekly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@500;600;700&display=swap">
<style>
/* V1PGL Weekly broadcast package, 1920x1080. Everything is driven by seek(t) so every frame renders the same way every time. */
:root{--gold:#d4a72c;--gold2:#f3d27a;--ink:#07070a;--panel:rgba(16,16,20,.82);--line:rgba(255,255,255,.1);--fg:#fff;--soft:#d6d6dc;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--body)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}

/* ---- background ---- */
.bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,#1c1709 0%,#0b0b0e 45%,#050507 100%)}
.bg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 96px),repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 96px)}
.bg-sweep{position:absolute;top:-30%;left:-40%;width:60%;height:160%;background:linear-gradient(100deg,transparent,rgba(212,167,44,.10) 45%,rgba(243,210,122,.16) 50%,rgba(212,167,44,.10) 55%,transparent);transform:skewX(-18deg);animation:sweep 14s linear infinite}
@keyframes sweep{from{transform:translateX(0) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
.bg-mark{position:absolute;right:-120px;bottom:-140px;width:900px;height:880px;background:url(assets/logo.webp) center/contain no-repeat;opacity:.05;filter:grayscale(.2)}
.bg-glow{position:absolute;left:50%;top:44%;width:1500px;height:900px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(212,167,44,.13),transparent);animation:breathe 6s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.6}to{opacity:1}}

/* ---- persistent bug + ticker + captions ---- */
.bug{position:absolute;left:56px;top:44px;display:flex;align-items:center;gap:16px;z-index:20}
.bug i{width:74px;height:72px;background:url(assets/logo.webp) center/contain no-repeat;filter:drop-shadow(0 0 10px rgba(212,167,44,.4))}
.bug b{display:block;font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.14em;line-height:1;background:linear-gradient(180deg,#fff6d6,var(--gold) 60%,#9c7614);-webkit-background-clip:text;background-clip:text;color:transparent}
.bug small{display:block;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.22em;color:var(--soft);margin-top:4px}
.live{position:absolute;right:56px;top:52px;z-index:20;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.2em;color:var(--soft);display:flex;gap:10px;align-items:center}
.live em{font-style:normal;padding:4px 12px;border-radius:4px;background:var(--gold);color:#140f02}
.ticker{position:absolute;left:0;right:0;bottom:0;height:64px;z-index:20;display:flex;align-items:stretch;background:linear-gradient(180deg,#0e0e12,#060608);border-top:2px solid var(--gold)}
.ticker .tag{flex:0 0 auto;display:grid;place-items:center;padding:0 26px;background:var(--gold);color:#140f02;font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.14em}
.ticker .rail{position:relative;flex:1;overflow:hidden}
.ticker .run{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;white-space:nowrap;animation:tick linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker .it{display:inline-flex;align-items:center;gap:12px;padding:0 34px;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.06em;text-transform:uppercase;color:#e9e9ee;border-right:1px solid rgba(255,255,255,.12)}
.ticker .it img{width:36px;height:36px;object-fit:contain}
.ticker .it b{color:#fff;font-weight:900}.ticker .it .w{color:var(--gold2)}
.cap{position:absolute;left:50%;bottom:92px;z-index:19;transform:translateX(-50%);max-width:1500px;padding:12px 26px;border-radius:10px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.08);
  font-family:var(--body);font-weight:600;font-size:34px;line-height:1.3;text-align:center;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.cap:empty{display:none}

/* ---- scenes ---- */
.scene{position:absolute;inset:0;opacity:0;z-index:10}
.anim{animation-fill-mode:both;animation-play-state:paused}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes left{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(120px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes count{from{opacity:0;transform:translateY(-40px) scale(1.3)}to{opacity:1;transform:none}}
@keyframes spinIn{from{opacity:0;transform:rotate(-200deg) scale(.3)}to{opacity:1;transform:none}}
@keyframes glint{0%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(220%) skewX(-20deg)}}
.title{position:absolute;left:0;right:0;top:150px;text-align:center}
.title h1{font-family:var(--display);font-weight:900;font-size:92px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.title h1 span{background:linear-gradient(180deg,#fff6d6,var(--gold2) 40%,var(--gold) 70%,#9c7614);-webkit-background-clip:text;background-clip:text;color:transparent}
.title p{margin-top:10px;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.3em;text-transform:uppercase;color:var(--soft)}
.title .bar{width:420px;height:4px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* open */
.op{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-bottom:60px}
.op .lg{width:340px;height:333px;background:url(assets/logo.webp) center/contain no-repeat;filter:drop-shadow(0 0 40px rgba(212,167,44,.45))}
.op h1{font-family:var(--display);font-weight:900;font-size:150px;letter-spacing:.08em;line-height:.9;position:relative;overflow:hidden;padding:0 20px}
.op h1 span{background:linear-gradient(180deg,#fffaf0,var(--gold2) 40%,var(--gold) 70%,#8f6a10);-webkit-background-clip:text;background-clip:text;color:transparent}
.op h1::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:glint 1.4s ease-in-out both;animation-delay:1.6s;animation-play-state:paused}
.op h2{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:.42em;color:#fff;text-transform:uppercase}
.op .pill{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.2em;padding:8px 26px;border-radius:40px;border:2px solid var(--gold);color:var(--gold2);text-transform:uppercase}

/* game */
.gm{position:absolute;left:120px;right:120px;top:140px;display:grid;grid-template-columns:1fr 520px 1fr;align-items:center;gap:30px}
.tm{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.tm .lg{width:260px;height:260px;object-fit:contain;filter:drop-shadow(0 12px 30px rgba(0,0,0,.6))}
.tm .ph{width:260px;height:260px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:110px;background:var(--tc,#333);color:#fff}
.tm h3{font-family:var(--display);font-weight:900;font-size:58px;line-height:.95;text-transform:uppercase;letter-spacing:.02em;max-width:560px}
.tm .rec{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.18em;color:var(--soft)}
.tm .stripe{width:220px;height:8px;border-radius:4px;background:var(--tc,var(--gold))}
.tm.lose{filter:saturate(.45) brightness(.7)}
.sc{display:flex;flex-direction:column;align-items:center;gap:14px}
.sc .fin{font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.3em;padding:6px 26px;border-radius:6px;background:var(--gold);color:#140f02}
.sc .nums{display:flex;align-items:center;gap:30px;font-family:var(--display);font-weight:900;font-size:200px;line-height:.9;font-variant-numeric:tabular-nums}
.sc .nums i{font-style:normal;font-size:80px;color:#55555c}
.sc .nums .w{color:#fff;text-shadow:0 0 40px rgba(243,210,122,.35)}.sc .nums .l{color:#77777e}
.qt{border-collapse:collapse;font-family:var(--display);font-weight:700;font-size:28px;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qt th,.qt td{padding:6px 16px;text-align:center}.qt th{color:var(--soft);font-size:20px;letter-spacing:.14em}.qt td:first-child{text-align:left;color:var(--soft);white-space:nowrap}.qt td.t{color:#fff;font-weight:900}
.stars{position:absolute;left:120px;right:120px;bottom:232px;display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.star{position:relative;display:flex;align-items:center;gap:22px;padding:18px 26px;border-radius:14px;background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--tc,var(--gold));overflow:hidden}
.star img{width:84px;height:84px;object-fit:contain;flex:0 0 auto}
.star .k{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.24em;color:var(--gold2)}
.star b{display:block;font-family:var(--display);font-weight:900;font-size:46px;line-height:1;text-transform:uppercase}
.star p{font-size:25px;color:var(--soft);margin-top:6px;font-weight:600}

/* lists (forced, milestones, next) */
.grid{position:absolute;left:150px;right:150px;top:340px;display:grid;gap:22px}
.card{position:relative;display:flex;align-items:center;gap:22px;padding:20px 28px;border-radius:14px;background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--tc,var(--gold))}
.card img{width:80px;height:80px;object-fit:contain;flex:0 0 auto}
.card b{display:block;font-family:var(--display);font-weight:900;font-size:40px;line-height:1.02;text-transform:uppercase}
.card p{font-size:26px;color:var(--soft);margin-top:4px;font-weight:600}
.card .big{margin-left:auto;font-family:var(--display);font-weight:900;font-size:56px;color:#fff;white-space:nowrap}
.card .tagx{margin-left:auto;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.16em;padding:6px 14px;border-radius:6px;background:rgba(212,167,44,.15);color:var(--gold2);border:1px solid rgba(212,167,44,.4);white-space:nowrap}

/* forced wins: results grid + top three performers */
.fwg{gap:14px}
.card.fw.sm{padding:12px 22px}.card.fw.sm img{width:60px;height:60px}.card.fw.sm b{font-size:32px}.card.fw.sm p{font-size:22px}.card.fw.sm .big{font-size:44px}
.fws .star{padding:14px 20px;gap:16px}.fws .star img{width:64px;height:64px}.fws .star b{font-size:36px}.fws .star p{font-size:22px}
/* potw */
.pw{position:absolute;left:150px;right:150px;top:320px;display:grid;grid-template-columns:1fr 1fr;gap:50px}
.pc{position:relative;display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:center;min-height:430px;padding:28px;border-radius:20px;background:var(--panel);border:1px solid var(--line);border-top:8px solid var(--tc,var(--gold));overflow:hidden}
.pc .ph{width:300px;height:360px;border-radius:14px;object-fit:cover;background:#111}
.pc .phl{width:300px;height:360px;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,255,255,.06),transparent)}
.pc .phl img{width:220px;height:220px;object-fit:contain}
.pc .k{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.28em;color:var(--gold2)}
.pc b{display:block;font-family:var(--display);font-weight:900;font-size:68px;line-height:.95;text-transform:uppercase;margin:10px 0}
.pc .tmn{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.06em;color:var(--soft);text-transform:uppercase}
.pc .tmn img{width:46px;height:46px;object-fit:contain}
.pc p{margin-top:16px;font-size:27px;line-height:1.35;color:#fff;font-weight:600}
.pc .res{display:inline-block;margin-top:12px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.14em;padding:4px 12px;border-radius:6px;background:rgba(255,255,255,.08)}

/* rankings */
.rk{position:absolute;left:300px;right:300px;top:300px;display:flex;flex-direction:column;gap:12px}
.rr{display:grid;grid-template-columns:120px 70px 1fr auto auto;align-items:center;gap:24px;padding:8px 28px;border-radius:14px;background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--tc,var(--gold))}
.rr .n{font-family:var(--display);font-weight:900;font-size:60px;line-height:1;color:var(--gold2);text-align:center}
.rr .n small{font-size:28px;color:var(--soft);margin-left:4px}
.rr img{width:64px;height:64px;object-fit:contain}
.rr b{font-family:var(--display);font-weight:900;font-size:46px;text-transform:uppercase}
.rr .r{font-family:var(--display);font-weight:700;font-size:32px;color:var(--soft)}
.rr .mv{font-family:var(--display);font-weight:900;font-size:32px;min-width:90px;text-align:right}
.mv.up{color:#4ee07a}.mv.dn{color:#ff6b6b}.mv.eq{color:#77777e}
.riser{margin-top:6px;text-align:center;font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:.1em;color:var(--soft);text-transform:uppercase}
.riser b{color:#4ee07a}

/* next week */
.nx{grid-template-columns:repeat(2,1fr)}
.mu{display:grid;grid-template-columns:90px 1fr 60px 1fr 90px;align-items:center;gap:14px;padding:18px 24px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.mu img{width:90px;height:90px;object-fit:contain}
.mu b{font-family:var(--display);font-weight:900;font-size:36px;line-height:1;text-transform:uppercase}
.mu .a{text-align:right}.mu .at{text-align:center;font-family:var(--display);font-weight:800;font-size:30px;color:var(--gold2)}
.mu small{display:block;font-family:var(--display);font-weight:700;font-size:22px;color:var(--soft);margin-top:4px;letter-spacing:.06em}
.mu .meta{grid-column:1/-1;display:flex;justify-content:center;gap:24px;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.12em;color:var(--soft);text-transform:uppercase;border-top:1px solid var(--line);padding-top:10px}
.mu .meta em{font-style:normal;color:var(--gold2)}

/* close */
.cl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding-bottom:80px}
.cl .lg{width:300px;height:294px;background:url(assets/logo.webp) center/contain no-repeat;filter:drop-shadow(0 0 40px rgba(212,167,44,.45))}
.cl h1{font-family:var(--display);font-weight:900;font-size:140px;letter-spacing:.12em;line-height:.9}
.cl h1 span{background:linear-gradient(180deg,#fffaf0,var(--gold2) 40%,var(--gold) 70%,#8f6a10);-webkit-background-clip:text;background-clip:text;color:transparent}
.cl h2{font-family:var(--display);font-weight:800;font-size:54px;letter-spacing:.12em;color:#fff}
.cl .one{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.18em;color:var(--soft);text-transform:uppercase;margin-top:-10px}.cl .one b{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:8px;background:var(--gold);color:#140f02;letter-spacing:0}
.cl p{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.3em;color:var(--soft);text-transform:uppercase}
.cl .tro{position:absolute;width:150px;height:238px;background:url(assets/trophy.webp) center/contain no-repeat;opacity:.9;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
</style>
</head>
<body>
<div id="stage">
  <div class="bg"><div class="bg-glow g-anim"></div><div class="bg-sweep g-anim"></div><div class="bg-mark"></div></div>
  <div id="scenes"></div>
  <div class="bug"><i></i><div><b>V1PGL WEEKLY</b><small id="bugSub"></small></div></div>
  <div class="live"><em>RECAP</em><span id="liveSub"></span></div>
  <div class="cap" id="cap"></div>
  <div class="ticker"><div class="tag">FINALS</div><div class="rail"><div class="run g-anim" id="run"></div></div></div>
</div>
<script>
/* ===== data → scenes ===== */
let SHOW = null, SCENES = [], CAPS = [];
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const A = (kind, delay, dur) => `anim" data-a="${kind},${delay},${dur || .7}`;   // animation set in init (keeps each element's own style attribute free)
function T(name){ const t = (SHOW.digest.teams || {})[name] || {}; return { name, full: t.full || name, color: t.color || "#d4a72c", logo: t.logo || "", rec: t.rec || "" }; }
const logo = (name, cls) => { const t = T(name); return t.logo ? `<img class="${cls || ""}" src="${esc(t.logo)}" alt="">` : `<div class="ph" style="--tc:${esc(t.color)}">${esc(name.slice(0, 1))}</div>`; };
const tc = name => `--tc:${T(name).color}`;

function sceneHtml(seg){
  const D = SHOW.digest;
  if(seg.kind === "open") return `<div class="op"><div class="lg ${A("spinIn", .1, 1.1)}"></div>
      <h1 class="${A("up", .7, .8)}"><span>V1PGL WEEKLY</span></h1>
      <h2 class="${A("fade", 1.2, .8)}">${esc(D.season)} · ${esc(D.label)}</h2>
      <div class="pill ${A("pop", 1.7, .6)}">${D.finals.length} game${D.finals.length === 1 ? "" : "s"} · ${D.forced.length} forced win${D.forced.length === 1 ? "" : "s"}</div></div>`;
  if(seg.kind === "game"){
    const f = D.finals.find(x => x.id === seg.game); if(!f) return "";
    const aw = f.awayScore > f.homeScore, hw = f.homeScore > f.awayScore;
    const team = (n, win, side, d) => `<div class="tm ${win ? "" : "lose"} ${A(side, d, .8)}" style="${tc(n)}">${logo(n, "lg")}<h3>${esc(T(n).full)}</h3><div class="rec">${esc(T(n).rec)}</div><div class="stripe"></div></div>`;
    const q = f.quarters ? `<table class="qt ${A("fade", 1.4, .6)}"><tr><th></th>${f.quarters.away.map((_, i) => `<th>${i < 4 ? "Q" + (i + 1) : "OT"}</th>`).join("")}<th>T</th></tr>
        <tr><td>${esc(f.away)}</td>${f.quarters.away.map(v => `<td>${esc(v)}</td>`).join("")}<td class="t">${f.awayScore}</td></tr>
        <tr><td>${esc(f.home)}</td>${f.quarters.home.map(v => `<td>${esc(v)}</td>`).join("")}<td class="t">${f.homeScore}</td></tr></table>` : "";
    const stars = f.stars.map((p, i) => { const m = (f.big.find(b => b.player === p.player) || {}).marks || [];
      return `<div class="star ${A("up", 2 + i * .35, .7)}" style="${tc(p.team)}">${T(p.team).logo ? `<img src="${esc(T(p.team).logo)}" alt="">` : ""}<div><div class="k">${i === 0 ? "STAR OF THE GAME" : "STANDOUT"}</div><b>${esc(p.player)}</b><p>${esc(p.line)}${m.length ? " · " + esc(m[0]) : ""}</p></div></div>`; }).join("");
    return `<div class="gm">${team(f.away, aw, "left", .1)}
        <div class="sc"><div class="fin ${A("pop", .3, .5)}">FINAL</div><div class="nums"><span class="${aw ? "w" : "l"} ${A("count", .55, .6)}">${f.awayScore}</span><i>–</i><span class="${hw ? "w" : "l"} ${A("count", .8, .6)}">${f.homeScore}</span></div>${q}</div>
        ${team(f.home, hw, "right", .1)}</div><div class="stars">${stars}</div>`;
  }
  if(seg.kind === "forced"){
    const F = D.forced, stars = D.forcedStars || [], cols = F.length > 2 ? 2 : 1, compact = F.length > 4;
    const res = F.map((x, i) => `<div class="card fw ${compact ? "sm" : ""} ${A("left", .4 + i * .15, .6)}" style="${tc(x.team)}">${logo(x.team)}<div><b>${esc(T(x.team).full)}</b><p>${x.reserve ? "vs the " + esc(x.oppFull) : "Forced win"}</p></div><div class="big">${x.us}–${x.them}</div></div>`).join("");
    const st = stars.map((p, i) => `<div class="star ${A("up", 1.2 + F.length * .15 + i * .3, .7)}" style="${tc(p.team)}">${T(p.team).logo ? `<img src="${esc(T(p.team).logo)}" alt="">` : ""}<div><div class="k">${i === 0 ? "TOP PERFORMER" : "STANDOUT"}</div><b>${esc(p.player)}</b><p>${esc(p.line)}</p></div></div>`).join("");
    return `<div class="title ${A("fade", 0, .6)}"><h1><span>FORCED WINS</span></h1><p>Around the rest of the league</p><div class="bar"></div></div>
      <div class="grid fwg" style="grid-template-columns:repeat(${cols},1fr);top:${stars.length ? 322 : 340}px">${res}</div>
      ${st ? `<div class="stars fws" style="grid-template-columns:repeat(${stars.length},1fr)">${st}</div>` : ""}`;
  }
  if(seg.kind === "potw"){
    const P = D.potw, card = (c, k, d) => !c ? "" : `<div class="pc ${A("up", d, .8)}" style="${tc(c.team)}">${c.photo ? `<img class="ph" src="${esc(c.photo)}" alt="">` : `<div class="phl">${logo(c.team)}</div>`}
        <div><div class="k">${k}</div><b>${esc(c.player)}</b><div class="tmn">${T(c.team).logo ? `<img src="${esc(T(c.team).logo)}" alt="">` : ""}${esc(T(c.team).full)}</div>${c.result ? `<span class="res">${esc(c.result)}</span>` : ""}<p>${esc(c.line)}</p></div></div>`;
    return `<div class="title ${A("fade", 0, .6)}"><h1><span>${P.official ? "PLAYERS OF THE WEEK" : "TOP PERFORMERS"}</span></h1><p>${esc(D.label)}</p><div class="bar"></div></div>
      <div class="pw">${card(P.off, "OFFENSE", .5)}${card(P.def, "DEFENSE", .9)}</div>`;
  }
  if(seg.kind === "milestones"){
    const rows = D.milestones.map(m => ({ team: m.team, b: m.player, p: m.text, tag: "MILESTONE" })).concat(D.records.map(r => ({ team: r.team, b: r.player || T(r.team).full, p: r.label + ": " + r.v, tag: "LEAGUE RECORD" })));
    return `<div class="title ${A("fade", 0, .6)}"><h1><span>MILESTONES &amp; RECORDS</span></h1><p>History made in ${esc(D.label)}</p><div class="bar"></div></div>
      <div class="grid">${rows.slice(0, 6).map((r, i) => `<div class="card ${A("left", .5 + i * .25, .6)}" style="${tc(r.team)}">${logo(r.team)}<div><b>${esc(r.b)}</b><p>${esc(r.p)}</p></div><div class="tagx">${r.tag}</div></div>`).join("")}</div>`;
  }
  if(seg.kind === "rankings"){
    const R = D.rankings, mv = m => m > 0 ? `<span class="mv up">▲ ${m}</span>` : m < 0 ? `<span class="mv dn">▼ ${-m}</span>` : `<span class="mv eq">–</span>`;
    return `<div class="title ${A("fade", 0, .6)}"><h1><span>POWER RANKINGS</span></h1><p>The top 5 heading into next week</p><div class="bar"></div></div>
      <div class="rk">${R.top.map((t, i) => `<div class="rr ${A("right", .5 + (R.top.length - 1 - i) * .3, .6)}" style="${tc(t.team)}"><div class="n">${t.rank}${t.full ? `<small>(${t.full})</small>` : ""}</div>${logo(t.team)}<b>${esc(T(t.team).full)}</b><span class="r">${esc(t.rec)}</span>${mv(t.move)}</div>`).join("")}
      ${R.riser ? `<div class="riser ${A("fade", 2.4, .6)}">Biggest climber: <b>${esc(T(R.riser.team).full)} ▲ ${R.riser.move}</b> to #${R.riser.rank}</div>` : ""}</div>`;
  }
  if(seg.kind === "next") return `<div class="title ${A("fade", 0, .6)}"><h1><span>UP NEXT</span></h1><p>${esc(D.nextLabel)}</p><div class="bar"></div></div>
      <div class="grid nx" style="top:${D.next.length > 6 ? 300 : 340}px">${D.next.slice(0, 8).map((n, i) => `<div class="mu ${A("up", .4 + i * .2, .6)}">${logo(n.away)}<div class="a"><b>${esc(n.away)}</b><small>${esc(T(n.away).rec)}</small></div><div class="at">@</div><div><b>${esc(n.home)}</b><small>${esc(T(n.home).rec)}</small></div>${logo(n.home)}
        <div class="meta">${n.day || n.time ? `<span>${esc([n.day, n.time && n.time + " ET"].filter(Boolean).join(" · "))}</span>` : ""}${n.line ? `<em>${esc(n.line)}</em>` : ""}</div></div>`).join("")}</div>`;
  if(seg.kind === "close") return `<div class="cl"><div class="lg ${A("pop", .1, .8)}"></div><h1 class="${A("up", .5, .8)}"><span>BE V1P</span></h1><h2 class="${A("fade", 1, .7)}">v1phub.com</h2><div class="one ${A("fade", 1.25, .7)}">V · <b>1</b> · P &nbsp;—&nbsp; with the number one</div><p class="${A("fade", 1.4, .7)}">Box scores · Stats · Power rankings</p>
      <div class="tro ${A("left", .8, .9)}" style="left:260px;top:330px"></div><div class="tro ${A("right", .8, .9)}" style="right:260px;top:330px"></div></div>`;
  return "";
}

/* captions: each segment's text split into sentences, timed by length across the voice */
function buildCaps(seg){
  const parts = (seg.text || "").match(/[^.!?]+[.!?]+["”’]?|[^.!?]+$/g) || [];
  const chunks = []; parts.forEach(p => { p = p.trim(); if(!p) return; if(p.length <= 110) chunks.push(p); else { const w = p.split(/\s+/); let cur = ""; w.forEach(x => { if((cur + " " + x).trim().length > 100){ chunks.push(cur.trim()); cur = x; } else cur += " " + x; }); if(cur.trim()) chunks.push(cur.trim()); } });
  const total = chunks.reduce((a, c) => a + c.length + 8, 0) || 1; let t = seg.speechStart;
  chunks.forEach(c => { const d = seg.speechDur * (c.length + 8) / total; CAPS.push({ s: t, e: t + d, text: c }); t += d; });
}

async function init(show){
  SHOW = show; const D = show.digest;
  document.getElementById("bugSub").textContent = `${D.season} · ${D.label}`.toUpperCase();
  document.getElementById("liveSub").textContent = D.label.toUpperCase();
  // ticker: every final, twice (so it loops seamlessly)
  const items = D.finals.map(f => { const aw = f.awayScore > f.homeScore;
    return `<span class="it">${T(f.away).logo ? `<img src="${esc(T(f.away).logo)}" alt="">` : ""}<b class="${aw ? "w" : ""}">${esc(f.away)} ${f.awayScore}</b> · <b class="${aw ? "" : "w"}">${esc(f.home)} ${f.homeScore}</b>${T(f.home).logo ? `<img src="${esc(T(f.home).logo)}" alt="">` : ""}</span>`; })
    .concat(D.forced.map(x => `<span class="it"><b class="w">${esc(x.team)} ${x.us}</b> · ${x.reserve ? esc(x.opp) + " " + x.them : x.them} <small>FW</small></span>`)).join("");
  const run = document.getElementById("run"); run.innerHTML = items + items;
  run.style.animationDuration = Math.max(20, (D.finals.length + D.forced.length) * 6) + "s";
  const host = document.getElementById("scenes");
  show.timeline.forEach(seg => { const el = document.createElement("div"); el.className = "scene"; el.innerHTML = sceneHtml(seg); host.appendChild(el); SCENES.push({ el, seg }); buildCaps(seg); });
  document.querySelectorAll("[data-a]").forEach(e => { const [k, d, u] = e.dataset.a.split(",");
    Object.assign(e.style, { animationName: k, animationDuration: u + "s", animationDelay: d + "s", animationTimingFunction: "cubic-bezier(.2,.8,.2,1)" }); });
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  await Promise.all([...document.images].map(im => im.decode ? im.decode().catch(() => {}) : 0));
  document.getAnimations().forEach(a => a.pause());
  seek(0);
  return { scenes: SCENES.length, images: document.images.length };
}

/* ===== the clock: put every element exactly where it belongs at time t ===== */
function seek(t){
  const FADE = .4;
  SCENES.forEach(({ el, seg }) => {
    const local = t - seg.start, on = local >= -FADE && local <= seg.dur + FADE;
    let o = 0; if(on){ o = Math.min(1, (local + FADE) / FADE, (seg.dur + FADE - local) / FADE); o = Math.max(0, Math.min(1, o)); }
    el.style.opacity = o.toFixed(3); el.style.visibility = o > 0 ? "visible" : "hidden";
    if(on) el.getAnimations({ subtree: true }).forEach(a => { a.pause(); a.currentTime = Math.max(0, local) * 1000; });
  });
  document.querySelectorAll(".g-anim").forEach(e => e.getAnimations().forEach(a => { a.pause(); a.currentTime = t * 1000; }));
  const c = CAPS.find(x => t >= x.s && t < x.e); const cap = document.getElementById("cap"); const txt = c ? c.text : "";
  if(cap.textContent !== txt) cap.textContent = txt;
}
window.init = init; window.seek = seek;
</script>
